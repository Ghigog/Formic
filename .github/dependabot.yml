version: 2

# Every third-party action is pinned by commit SHA in .github/workflows/
# (AUD-18), so a moved tag cannot change what runs with our secrets.
# Dependabot is what keeps those pins current: when a new action release
# lands, it opens a pull request that bumps the SHA and the `# vX.Y.Z`
# comment beside it. Review the diff, then merge.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Majors are ignored below, so this is every minor and patch bump in one PR.
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # Majors break things here (TypeScript 7 and ESLint 10 both outrun
      # typescript-eslint and eslint-config-next). Upgrade them by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
