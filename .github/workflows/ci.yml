name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request replaces the run still going on the old one.
# Pushes to main are keyed by commit, so a deploy is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every check below is its own job, and so its own check run on the commit:
# the Reviewer Agent reads them by name, so a red `lint` or `test` says what
# broke. Keep job ids stable, and keep the jobs independent (no `needs`):
# a job still waiting has no check run yet, which reads as nothing pending.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formic
          POSTGRES_PASSWORD: formic
          POSTGRES_DB: formic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U formic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests run on the in-memory store by design, so no DATABASE_URL.
      # The repository contract suite also runs against Postgres, through
      # TEST_DATABASE_URL, once the schema is pushed.
      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://formic:formic@localhost:5432/formic_test
      # The github-actions reporter turns a failing test into an annotation,
      # which is what the Reviewer Agent reads to diagnose a red check.
      # Coverage is for the Tester sentinel, which reads main's summary.
      - run: npm test -- --reporter=default --reporter=github-actions --coverage
        env:
          TEST_DATABASE_URL: postgresql://formic:formic@localhost:5432/formic_test

      - name: Keep the coverage summary for the Sentinels
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-evidence-coverage
          path: coverage/coverage-summary.json
          retention-days: 14

  # One production build, then the two checks that run on it: boot against a
  # real database, and the board in a real browser. Steps of one job rather
  # than jobs of their own: a job that waits on another has no check run until
  # it starts, and the Reviewer Agent reads the check runs on a commit, so a
  # gap there could read as all green. Keep them here.
  #
  # The build has no database: every page is rendered on demand, so nothing in
  # the output depends on one. The migrations run in the boot step.
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formic
          POSTGRES_PASSWORD: formic
          POSTGRES_DB: formic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U formic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'scripts/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      # What the build ships, for the Performance sentinel.
      - run: node scripts/bundle-stats.mjs

      # A real database from here on, so the migrations and the app's runtime
      # queries run here first, not first in production.
      - name: Boot the production build and hit it
        env:
          DATABASE_URL: postgresql://formic:formic@localhost:5432/formic
        run: |
          bash scripts/db-push.sh
          npx next start -p 3111 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:3111/api/health > health.json && break
            sleep 1
          done
          cat health.json
          jq -e '.ok == true and .database == "postgres"' health.json
          curl -sf -o /dev/null http://localhost:3111/
          grep -q "seeded the demo board" server.log

      - name: Server log
        if: always()
        run: |
          cat server.log || true
          kill "$(cat server.pid)" 2>/dev/null || true

      # The board in a real browser: drags, round trips, the production build,
      # on the in-memory store the suite is written against.
      #
      # The runner image ships Chromium: point Playwright at it rather than
      # downloading one with `playwright install`.
      - name: Find the pre-installed Chromium
        run: |
          chromium="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$chromium" ]; then
            echo "::error::No pre-installed Chromium on this runner."
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$chromium" >> "$GITHUB_ENV"
          "$chromium" --version

      # Starts the server on the build above rather than building again.
      - run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      # Screenshots and axe scans from e2e/evidence.spec.ts, and the bundle
      # stats above: what the Sentinels read about the running app.
      - name: Keep what the Sentinels read
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sentinel-evidence
          path: e2e/.evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: e2e/.results
          retention-days: 7

  # Production deploys only once every job above passes on main. vercel.json turns
  # off Vercel's own Git deploy for main, so this is the only path to prod.
  # With the DEPLOY_HOST variable set it deploys to the server instead
  # (deploy/server, docs/google-cloud.md); without it, to Vercel.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time, in merge order; never cancel one mid-flight.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Server: build here (it has too little memory to build), ship the
      # result, and let the server migrate and switch to it. The build needs
      # no secrets: every page renders on demand (see the build job).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.DEPLOY_HOST != ''
        with:
          node-version: 22
          cache: npm
      - name: Build for the server
        if: env.DEPLOY_HOST != ''
        run: |
          npm ci
          npm run build
          tar --exclude=./.git --exclude=./.next/cache -czf "$RUNNER_TEMP/release.tgz" .
      - name: Deploy to the server
        if: env.DEPLOY_HOST != ''
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY secret is not set, so main can't deploy."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh_() { ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "formic@$DEPLOY_HOST" "$@"; }
          ssh_ "cat > /opt/formic/releases/$GITHUB_SHA.tgz" < "$RUNNER_TEMP/release.tgz"
          ssh_ "cat > /opt/formic/deploy.sh" < deploy/server/deploy.sh
          ssh_ "bash /opt/formic/deploy.sh $GITHUB_SHA"

      - name: Check the Vercel secrets are set
        if: env.DEPLOY_HOST == ''
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v secret is not set, so main can't deploy."
              exit 1
            fi
          done
      # Builds on Vercel with the project's own env vars, as the Git
      # integration did, and carries this commit's SHA for /api/health.
      # Pinned, and its download cached, so a deploy does not fetch the CLI
      # (or pick up a new release) every time. Dependabot does not track this.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.DEPLOY_HOST == ''
        with:
          path: ~/.npm
          key: vercel-cli-${{ runner.os }}-61.1.0
      - if: env.DEPLOY_HOST == ''
        run: npx --yes vercel@61.1.0 deploy --prod --yes --token "$VERCEL_TOKEN"
