name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for this commit to be live, then check it
        env:
          PROD_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "No PRODUCTION_URL repository variable set, skipping."
            exit 0
          fi
          base="${PROD_URL%/}"

          # Checking right after a merge would test the previous deploy, so
          # first wait until /api/health reports this commit. Vercel builds
          # take about a minute; give it six.
          deadline=$((SECONDS + 360))
          while :; do
            status=$(curl -s -o health.json -w '%{http_code}' --max-time 15 "$base/api/health" || echo 000)
            live=$(jq -r '.commit // "unknown"' health.json 2>/dev/null || echo unknown)
            if [ "$live" = "$GITHUB_SHA" ] || [ "$live" = "unknown" ] || [ "$live" = "null" ]; then
              [ "$status" = "200" ] && break
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::Production never became healthy on $GITHUB_SHA (serving: $live, /api/health: HTTP $status)"
              cat health.json 2>/dev/null
              exit 1
            fi
            echo "Serving $live, /api/health $status; waiting for $GITHUB_SHA..."
            sleep 20
          done

          cat health.json; echo
          if [ "$live" != "$GITHUB_SHA" ]; then
            echo "::warning::/api/health doesn't report a commit, so this may be checking an older deploy."
          fi
          jq -r '.warnings[]?' health.json | while read -r w; do echo "::warning::$w"; done

          # With GitHub sign-in on, / redirects to the sign-in page; follow it.
          page=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 15 "$base/")
          if [ "$page" != "200" ]; then
            echo "::error::/ returned HTTP $page"
            exit 1
          fi
          echo "Production is healthy on $live."
