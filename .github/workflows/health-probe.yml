name: Production health probe

on:
  # Catches an outage between deploys: GitHub runs this every 15 minutes (it
  # may start a few minutes late under load). Can also be dispatched by hand:
  # Actions → Production health probe → Run workflow.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  health-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe /api/health
        env:
          PROD_URL: ${{ vars.PRODUCTION_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          alert() {
            echo "::error::$1"
            if [ -z "$ALERT_WEBHOOK_URL" ]; then
              echo "No ALERT_WEBHOOK_URL secret set, alert stayed in this log only."
              return 0
            fi
            local text="$1 (run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            curl -s -X POST -H 'content-type: application/json' \
              -d "$(jq -n --arg text "$text" '{text: $text}')" "$ALERT_WEBHOOK_URL" >/dev/null || true
          }

          if [ -z "$PROD_URL" ]; then
            echo "::error::No PRODUCTION_URL repository variable set. Set it under Settings → Secrets and variables → Actions → Variables to the production URL."
            exit 1
          fi
          base="${PROD_URL%/}"

          # Up to three tries, about 20s apart, to ride out a blip.
          for attempt in 1 2 3; do
            status=$(curl -s -o health.json -w '%{http_code}' --max-time 15 "$base/api/health" || echo 000)
            ok=$(jq -r '.ok // false' health.json 2>/dev/null || echo false)
            if [ "$status" = "200" ] && [ "$ok" = "true" ]; then
              cat health.json; echo
              echo "Production is healthy."
              exit 0
            fi
            echo "Attempt $attempt: /api/health HTTP $status, ok: $ok"
            [ "$attempt" -lt 3 ] && sleep "${PROBE_RETRY_SLEEP:-20}"
          done

          commit=$(jq -r '.commit // "unknown"' health.json 2>/dev/null || echo unknown)
          db=$(jq -r '.database // "unknown"' health.json 2>/dev/null || echo unknown)
          alert "Production health check failed: $base/api/health returned HTTP $status (ok: $ok, database: $db) on commit $commit. Playbook: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/runbook.md#database-unreachable"
          exit 1
